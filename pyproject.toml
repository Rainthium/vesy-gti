[project]
name = "ves-system"
version = "0.1.0"
description = "Единая весовая система ОАО «ГТИ»: центральный сервер и агенты весовых ПК"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyserial>=3.5",
    "websockets>=17.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyserial>=3.5.0.20260712",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "center", "shared", "tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # предупреждения pycodestyle
    "I",   # сортировка импортов
    "UP",  # модернизация под текущий Python
    "B",   # bugbear: вероятные ошибки
    "SIM", # упрощение кода
    "RUF", # правила ruff
]
# RUF001-003 считают кириллицу «неоднозначными символами» — несовместимо
# с конвенцией проекта (комментарии, докстринги и UI на русском)
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true

# shared/ и драйверы — ядро с обязательной строгой типизацией (CLAUDE.md)
[[tool.mypy.overrides]]
module = ["shared.*", "agent.drivers.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
