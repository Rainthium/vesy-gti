# CI: ruff (формат + линт), mypy, pytest — на каждый push и pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ves
          POSTGRES_PASSWORD: ves
          POSTGRES_DB: ves
        ports:
          - 5443:5432
        options: >-
          --health-cmd "pg_isready -U ves -d ves"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ves:ves@localhost:5443/ves
    steps:
      - uses: actions/checkout@v4

      - name: Установка uv и Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: uv sync

      - name: Формат (ruff format --check)
        run: uv run ruff format --check .

      - name: Линт (ruff check)
        run: uv run ruff check .

      - name: Типизация (mypy)
        run: uv run mypy .

      - name: Тесты (pytest)
        run: uv run pytest -q
