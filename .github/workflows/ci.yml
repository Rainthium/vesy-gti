# CI: ruff (формат + линт), mypy, pytest — на каждый push и pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка uv и Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: uv sync

      - name: Формат (ruff format --check)
        run: uv run ruff format --check .

      - name: Линт (ruff check)
        run: uv run ruff check .

      - name: Типизация (mypy)
        run: uv run mypy .

      - name: Тесты (pytest)
        run: uv run pytest -q
