# Сборка ves-agent.exe (Windows) на GitHub-раннере.
# Запуск: тег agent-v* (архив прикрепляется к релизу) или вручную (workflow_dispatch —
# архив забирается из артефактов запуска).
name: Сборка агента

on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:

permissions:
  contents: write # создание релиза по тегу

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # Windows по умолчанию читает файлы в cp1252 — русские комментарии
      # (spec, конфиги) требуют UTF-8 во всех текстовых операциях Python
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Установка uv и Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: uv sync

      - name: Сборка PyInstaller (onedir)
        run: |
          uv run --with pyinstaller pyinstaller packaging/agent/ves-agent.spec --noconfirm 2>&1 |
            Tee-Object -FilePath pyinstaller.log
          if ($LASTEXITCODE -ne 0) {
            # хвост лога — в аннотации: их видно анонимно через публичный API,
            # в отличие от логов запуска (лимит GitHub: 10 error на шаг)
            Get-Content pyinstaller.log -Tail 10 | ForEach-Object { Write-Output "::error::$_" }
            exit 1
          }

      - name: Дымовая проверка exe
        run: |
          # --help импортирует весь агент (uvicorn, драйверы, веб) — ловит
          # недостающие hiddenimports ещё на сборке; вывод при сбое — в
          # аннотации (логи запусков анонимно недоступны)
          $out = & dist\ves-agent\ves-agent.exe --help 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Output $_ }
          if ($code -ne 0) {
            $out | Select-Object -Last 10 | ForEach-Object { Write-Output "::error::$_" }
            Write-Output "::error::exe завершился с кодом $code"
            exit 1
          }
          # ресурсы, которые модули ищут через Path(__file__).parent
          foreach ($p in @(
            "dist\ves-agent\_internal\agent\web\templates\base.html",
            "dist\ves-agent\_internal\agent\web\static\htmx.min.js",
            "dist\ves-agent\_internal\agent\cameras\fonts\DejaVuSans-Bold-subset.ttf"
          )) {
            if (-not (Test-Path $p)) {
              Write-Output "::error::в сборке нет ресурса: $p"
              exit 1
            }
          }

      - name: Комплект установки (zip)
        run: |
          $version = uv run python -c "import agent; print(agent.__version__)"
          New-Item -ItemType Directory dist\bundle | Out-Null
          Copy-Item -Recurse dist\ves-agent dist\bundle\app
          Copy-Item agent\config.example.toml dist\bundle\
          Copy-Item packaging\agent\install-service.bat dist\bundle\
          Copy-Item packaging\agent\update.bat dist\bundle\
          Copy-Item docs\install-agent-windows.md "dist\bundle\УСТАНОВКА.md"
          Compress-Archive -Path dist\bundle\* -DestinationPath "dist\ves-agent-$version-win64.zip"
          echo "Собран ves-agent-$version-win64.zip"

      - name: Артефакт запуска
        uses: actions/upload-artifact@v4
        with:
          name: ves-agent-win64
          path: dist/*.zip
          if-no-files-found: error

      - name: Релиз (по тегу agent-v*)
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            Сборка агента весового ПК (Windows x64).
            Установка: распаковать архив, следовать УСТАНОВКА.md внутри.
