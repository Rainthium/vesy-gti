# Боевой compose центра (ВМ Ubuntu): app + postgres + rabbitmq + nginx.
# Секреты — в deploy/.env (скопировать из .env.example, правило проекта №7).
# Запуск из каталога deploy/:  docker compose up -d --build
# Пошагово — deploy/README.md.
name: ves-center

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ves
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте в deploy/.env}
      POSTGRES_DB: ves
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ves -d ves"]
      interval: 5s
      timeout: 3s
      retries: 10

  # брокер событий в АИС «СВХ» (контракт v2, раздел 7): свой, на ВМ центра
  # (decisions 17.08.2026). Учётка vesy-center — публикатор центра (создаётся
  # брокером из env); учётка АИС ais-svh с правом только читать очередь
  # ais-svh.weighings заводится один раз rabbitmqctl — deploy/README.md §2а.
  # Порт 5672 открыт наружу для серверов АИС (доступ режет firewall ВМ).
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    hostname: vesy-rabbit  # имя узла = имя каталога данных: не менять
    environment:
      RABBITMQ_DEFAULT_USER: vesy-center
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?задайте в deploy/.env}
      RABBITMQ_DEFAULT_VHOST: vesy
    ports:
      - "5672:5672"
      # панель управления брокером: ВРЕМЕННО открыта наружу — идёт тест
      # разработчиков АИС (с 20.08.2026; учётка ais-svh, тег management,
      # права по-прежнему только чтение своей очереди). Раньше порт был
      # только с самой ВМ и каждый ship затирал ручное открытие — надоело
      # переоткрывать. После теста ВЕРНУТЬ "127.0.0.1:15672:15672" и снять
      # тег: rabbitmqctl set_user_tags ais-svh
      - "15672:15672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # применяет миграции и завершается; app стартует только после успеха
  migrate:
    image: ves-center:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://ves:${POSTGRES_PASSWORD}@postgres:5432/ves
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ves-center:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      CENTER_ENV: production  # отказ старта с dev-дефолтами (center/app.py)
      DATABASE_URL: postgresql+psycopg://ves:${POSTGRES_PASSWORD}@postgres:5432/ves
      PANEL_SECRET: ${PANEL_SECRET:?задайте в deploy/.env}
      # Secure-cookie панели: включать только при доступе исключительно
      # по https (на пилоте в панель ходят и по внутреннему http)
      PANEL_COOKIE_SECURE: ${PANEL_COOKIE_SECURE:-0}
      AIS_PHOTO_TOKEN: ${AIS_PHOTO_TOKEN:?задайте в deploy/.env}
      V1_USERNAME: ${V1_USERNAME:-admin}
      V1_PASSWORD: ${V1_PASSWORD:?задайте в deploy/.env (admin — осознанная совместимость с АИС)}
      V1_WEIGH_TIMEOUT_S: ${V1_WEIGH_TIMEOUT_S:-120}
      AIS_ALLOWED_IPS: ${AIS_ALLOWED_IPS:-}
      # Telegram-уведомления мониторинга; пусто — выключены
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # события в АИС «СВХ» (RabbitMQ на этой же ВМ); публикатор центра
      RABBITMQ_URL: amqp://vesy-center:${RABBITMQ_PASSWORD}@rabbitmq:5672/vesy
      PHOTOS_DIR: /data/photos
      AGENT_RELEASES_DIR: /data/releases
    volumes:
      - photos:/data/photos
      # релизы агента для автообновления: загружаются через панель
      # («Релизы агентов») или кладутся с рабочей машины scp — README §9;
      # запись нужна панели, поэтому том не :ro (с 18.08.2026)
      - ./releases:/data/releases
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # rabbitmq намеренно НЕ в depends_on: центр (агенты, команды АИС, панель)
      # должен подниматься и без брокера — публикатор сам ждёт его и повторяет
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # включить после установки сертификата — deploy/README.md
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  photos:
  rabbitmq:
