# Обратный прокси центра весовой системы (vesy.gti.kg).
# Всё проксируется в app: авторизация (токены агентов, сервисные токены АИС,
# сессии панели) — внутри приложения; nginx ничего не раздаёт напрямую.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name vesy.gti.kg;

    # фото с камер (JPEG q85, родное разрешение) — запас по размеру тела
    client_max_body_size 32m;

    # WebSocket агентов: долгоживущее соединение, heartbeat каждые 5 с
    location /agents/ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # много больше интервала heartbeat
        proxy_send_timeout 60s;
    }

    # АИС ещё не переключена на центр, а домен vesy.gti.kg доступен из
    # интернета (проверено 10.08.2026) — эндпоинт с admin/admin по контракту
    # закрыт до боевой интеграции. Исключение: рабочее место Игоря
    # (проверки пилота имитатором tools/ais_client.py).
    # При переключении АИС: заменить allow на адреса АИС.
    location /api/v1/ {
        allow 192.168.15.9;
        deny all;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/v1/weigh держит запрос, пока АТС заезжает на весы
        proxy_read_timeout 180s;
    }

    # Нативный API v2 (контракт с АИС «СВХ» от 17.08.2026): серверы АИС —
    # боевой 192.168.140.150 и тестовый 192.168.6.116, рабочие места
    # разработчиков АИС (192.168.15.10/.2/.4 — их просьба 18.08.2026) и
    # рабочее место Игоря (имитатор tools/ais_client_v2.py). В приложении
    # дополнительно сервисный токен + AIS_ALLOWED_IPS.
    location /api/v2/ {
        allow 192.168.140.150;
        allow 192.168.6.116;
        allow 192.168.15.10;
        allow 192.168.15.2;
        allow 192.168.15.4;
        allow 192.168.15.9;
        deny all;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # команда держит запрос, пока АТС заезжает на весы (до 120 с)
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/v1/weigh держит запрос, пока АТС заезжает на весы
        # (V1_WEIGH_TIMEOUT_S, по умолчанию 120 с) — таймаут с запасом
        proxy_read_timeout 180s;
    }
}

