# Обратный прокси центра весовой системы (vesy.gti.kg).
# Всё проксируется в app: авторизация (токены агентов, сервисные токены АИС,
# сессии панели) — внутри приложения; nginx ничего не раздаёт напрямую.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# --- Ограничения частоты (21.10.2026) ---
# Всё, что идёт через домен vesy.gti.kg, приходит с адреса корпоративного
# прокси 192.168.6.134; реальный адрес человека прокси ДОПИСЫВАЕТ последним
# в X-Forwarded-For (проверено: подставленный клиентом адрес остаётся
# левее). Поэтому для лимита на вход в панель берём последний элемент
# заголовка, если соединение от прокси, иначе сам $remote_addr.
map $http_x_forwarded_for $xff_last_addr {
    default "";
    "~(?<xff_ip>[0-9a-fA-F.:]+)\s*$" $xff_ip;
}
map $remote_addr $panel_client_addr {
    192.168.6.134 $xff_last_addr;
    default       $remote_addr;
}
# --- Адрес интегратора (12.11.2026) ---
# Таможенная система (Таргет-центр) ходит за документами и фото по
# https://vesy.gti.kg, то есть через корпоративный прокси: её настоящий
# адрес — тот же $panel_client_addr (последний элемент X-Forwarded-For от
# прокси), а не $remote_addr. Поэтому список разрешённых адресов /api/v2/
# сверяется с $panel_client_addr; для прямых соединений (АИС «СВХ») это
# по-прежнему сам $remote_addr.
# Новый адрес интегратора — строка здесь И в AIS_ALLOWED_IPS (deploy/.env).
map $panel_client_addr $api_v2_allowed {
    default         0;
    192.168.140.150 1;  # АИС «СВХ», боевой сервер
    192.168.6.116   1;  # АИС «СВХ», тестовый сервер
    192.168.15.10   1;  # разработчики АИС (их просьба 18.08.2026)
    192.168.15.2    1;
    192.168.15.4    1;
    192.168.15.9    1;  # рабочее место Игоря (имитатор)
    192.168.0.115   1;  # Таргет-центр ГТС (таможенная система), только чтение
}
# считаем только POST /panel/login (сама форма — GET — не ограничивается);
# пустой ключ = запрос не учитывается
map $request_method $login_client_key {
    POST    $panel_client_addr;
    default "";
}
map $request_method $login_global_key {
    POST    "all";
    default "";
}
# вход: 1 попытка/с на человека (всплеск 10) + общий потолок 5/с (всплеск
# 30) на случай, если кто-то научится подделывать адрес; фото интеграторов
# /vesy/: 50/с с адреса клиента (всплеск 100; за прокси — настоящего, как у
# входа в панель) — серверы АИС ходят своими адресами и
# укладываются с запасом, перебор ссылок получает 429 после первой сотни.
# Лишние запросы отвергаются сразу (nodelay), без очереди — через секунду
# можно снова; блокировки на время нет.
limit_req_zone $login_client_key zone=panel_login:1m  rate=1r/s;
limit_req_zone $login_global_key zone=panel_login_all:1m rate=5r/s;
limit_req_zone $panel_client_addr zone=photos:10m    rate=50r/s;
limit_req_status 429;

server {
    listen 80;
    server_name vesy.gti.kg;

    # --- Гигиена ответов (аудит 04.11.2026) ---
    # версию nginx в Server и на страницах ошибок не показываем
    server_tokens off;
    # заголовки безопасности: через корпоративный прокси они проходят как есть.
    # always — и на 4xx/5xx. CSP не ставим: панель на HTMX с инлайн-скриптами
    # графиков, список источников нужно выверять на стенде (отчёт B1)
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS — после перевода ВМ на https (отчёт A1): по http браузер его игнорирует

    # фото с камер (JPEG q85, родное разрешение) и загрузка релиза агента
    # через панель (архив ~30 МБ, «Релизы агентов») — запас по размеру тела
    client_max_body_size 64m;

    # WebSocket агентов: долгоживущее соединение, heartbeat каждые 5 с
    location /agents/ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # много больше интервала heartbeat
        proxy_send_timeout 60s;
    }

    # Совместимый API v1 (admin/admin по старому контракту) закрыт целиком
    # с 04.11.2026: все объекты на v2, за 30 дней — ни одного запроса v1.
    # Роутер в приложении остаётся до следующего релиза (tools/ais_client.py
    # на стенде); открывать назад — только по решению Игоря.
    location /api/v1/ {
        deny all;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/v1/weigh держит запрос, пока АТС заезжает на весы
        proxy_read_timeout 180s;
    }

    # Нативный API v2 (контракт с АИС «СВХ» от 17.08.2026): серверы АИС —
    # боевой 192.168.140.150 и тестовый 192.168.6.116, рабочие места
    # разработчиков АИС (192.168.15.10/.2/.4 — их просьба 18.08.2026) и
    # рабочее место Игоря (имитатор tools/ais_client_v2.py); с 12.11.2026 —
    # Таргет-центр ГТС (таможенная система, только чтение, приходит через
    # корпоративный прокси). В приложении дополнительно сервисный токен +
    # AIS_ALLOWED_IPS.
    location /api/v2/ {
        # список адресов — map $api_v2_allowed выше
        if ($api_v2_allowed = 0) {
            return 403;
        }
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        # приложению — ОДИН проверенный адрес клиента: uvicorn берёт первый
        # элемент X-Forwarded-For, и присланный клиентом заголовок позволял
        # выдать себя за адрес из AIS_ALLOWED_IPS (найдено 12.11.2026)
        proxy_set_header X-Forwarded-For $panel_client_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # команда держит запрос, пока АТС заезжает на весы (до 120 с)
        proxy_read_timeout 180s;
    }

    # вход в панель — лимит попыток (см. зоны выше); PBKDF2 на 200k
    # итераций делает каждую попытку дорогой для центра
    location = /panel/login {
        limit_req zone=panel_login     burst=10 nodelay;
        limit_req zone=panel_login_all burst=30 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # фото для интеграторов (контракт v2 §5): токен + AIS_ALLOWED_IPS
    # проверяет приложение; здесь — только лимит частоты с адреса
    location /vesy/ {
        limit_req zone=photos burst=100 nodelay;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        # один проверенный адрес клиента — см. /api/v2/
        proxy_set_header X-Forwarded-For $panel_client_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/v1/weigh держит запрос, пока АТС заезжает на весы
        # (V1_WEIGH_TIMEOUT_S, по умолчанию 120 с) — таймаут с запасом
        proxy_read_timeout 180s;
    }
}

